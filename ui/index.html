<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Whatnot API Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#content">Skip to the selected function</a>
  <header class="top">
    <div class="brand">
      <h1>Whatnot API Demo</h1>
      <p class="sub">Every function of the Whatnot Seller API, with the real response it gave.</p>
    </div>
    <nav class="views" aria-label="Views">
      <button type="button" id="view-explorer" aria-pressed="true">Explorer</button>
      <button type="button" id="view-tour" aria-pressed="false">Tour</button>
    </nav>
    <p id="status" class="status" role="status">Loading...</p>
  </header>

  <main id="content" tabindex="-1">
    <div id="explorer" class="layout">
      <aside class="side" aria-label="Functions">
        <div id="list"></div>
      </aside>
      <section id="detail" class="detail" aria-label="Selected function"></section>
    </div>
    <section id="tour" class="tour" aria-label="Tour" hidden></section>
  </main>

  <footer class="foot">Mood Swings Design</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
